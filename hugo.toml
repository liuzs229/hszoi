baseURL = 'https://hszoi.pages.dev/'
languageCode = 'zh-cn'
title = 'HSZ OIer Blog'
theme = 'stack'
cleanDestinationDir = true

# 默认内容语言（可用值: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw）
DefaultContentLanguage = "zh-cn"
# 是否为中日韩语言（使用中文/日文/韩文时设为 true）
hasCJKLanguage = true

# 简体中文配置
# [languages."zh-cn"]
# languageName = "简体中文"
# weight = 2
# [languages."zh-cn".params.sidebar]
# subtitle = ""

# Google Analytics 跟踪 ID（留空禁用）
[services.googleAnalytics]
id = ""

# ======================================
# 内容展示设置
# ======================================

# 分页设置 - 显示的分页按钮数量
[pagination]
pagerSize = 5

# 永久链接格式设置
# [permalinks]
# post = "/p/:slug/"  # 文章链接格式（:slug 为文章别名）
# page = "/:slug/"    # 页面链接格式

# ======================================
# 主题参数配置
# ======================================
[params]
# RSS 是否包含完整内容
rssFullContent = true
# 网站图标路径（放在 static/ 目录下，如 /favicon.ico）
favicon = ""
search = true

[params.sidebar]
# emoji = "🍥"  # 侧边栏显示的 emoji
subtitle = ""  # 副标题

# 头像设置
[params.sidebar.avatar]
enabled = true  # 是否启用头像
local = true    # 是否使用本地图片
src = "img/avatar.png"  # 头像图片路径（相对于 static/ 目录）

[params.article]
math = true     # 是否启用数学公式支持
toc = true       # 是否显示目录
readingTime = true  # 是否显示阅读时间估算

[markup.tableOfContents]
startLevel = 1  # 从h1开始
endLevel = 3    # 到h3结束

[params.widgets]
page = [
    { type = "toc" }  # 确保包含 TOC 小部件
]
# 首页显示的小部件
homepage = [
    { type = "search", params = { placeholder = "搜索文章..." }},  # 搜索框
    # 归档（显示最近5个月）
    { type = "archives", params = { limit = 5 } },
    # 分类（显示最多10个）
    { type = "categories", params = { limit = 30 , style = "cloud" , colorize = true} },
    # 标签云（显示最多10个标签）
    { type = "tag-cloud", params = { limit = 50 , minFont = 14 , maxFont = 32 , colorize = true } }
]

[outputs]
home = ["HTML", "RSS", "JSON"]   # 确保包含JSON

# 文章默认许可证设置
[params.article.license]
enabled = true   # 是否显示许可证信息
default = "Licensed under CC BY-NC-SA 4.0 署名—非商业性使用—相同方式共享 4.0 协议国际版"  # 默认许可证文本



# 菜单设置
[[menu.main]]
name = "首页"
url = "/"
weight = 1
identifier = "home"
[menu.main.params]
icon = "home"

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 2
identifier = "archives"
[menu.main.params]
icon = "infinity"

[[menu.main]]
name = "获奖"
url = "/award/"
weight = 3
identifier = "award"
[menu.main.params]
icon = "user"

[[menu.main]]
name = "关于"
url = "/about/"
weight = 4
identifier = "about"
[menu.main.params]
icon = "link"

[[menu.main]]
name = "题库"
url = "https://oj.hszoi.org/"
weight = 5
identifier = "problem"
[menu.main.params]
icon = "link"